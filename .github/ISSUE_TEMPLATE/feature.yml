name: Feature request
description: Propose a focused improvement
body:
  - type: markdown
    attributes:
      value: Never include keys, tokens, cookies, user records or private recovery material.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Problem and proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence and limitations
